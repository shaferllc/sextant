name: Release

# Bump VERSION on main and this cuts a signed, notarized release through the
# shared shaferllc Mac release (shaferllc/.github). Run it by hand from the
# Actions tab for a dry run: build, sign, notarize and verify, publish nothing.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Dry run — build, sign and notarize without publishing
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  release:
    uses: shaferllc/.github/.github/workflows/mac-release.yml@main
    with:
      app: Sextant
      notes: >-
        A tiny menu bar utility for measuring, aligning, and reading the screen: a fullscreen crosshair through your pointer, a circular pixel loupe beside it, a ruler you drag across any two points, sticky guides, a layout grid, and a freeze that holds a menu still while you take your sight.
      dry_run: ${{ inputs.dry_run == true }}
    secrets: inherit
